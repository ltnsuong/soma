<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Soma — Your AI Life Companion</title>
    <meta name="description" content="Your personal AI companion for growth, reflection and building the life you want." />
    <meta name="theme-color" content="#0F0A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soma" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mysoma.site/" />
    <meta property="og:title" content="Soma — Your AI Life Companion" />
    <meta property="og:description" content="The best version of you starts with knowing yourself. Your personal AI companion for growth, reflection and building the life you want." />
    <meta property="og:image" content="https://mysoma.site/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soma — Your AI Life Companion" />
    <meta name="twitter:description" content="The best version of you starts with knowing yourself." />
    <meta name="twitter:image" content="https://mysoma.site/og-image.png" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Telegram Mini App SDK — provides window.Telegram.WebApp when opened inside Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style id="expo-reset">
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background-color: #0F0A2E; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Ensure no white flash on safe-area / notch area */
      html { background-color: #0F0A2E; }

      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Button press & hover effect */
      [data-focusable="true"] {
        transition: transform 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.12s ease;
      }
      [data-focusable="true"]:hover { opacity: 0.92; }
      [data-focusable="true"]:active {
        transform: scale(0.96) !important;
        opacity: 0.80;
      }

      /* Remove tap highlight on mobile */
      * { -webkit-tap-highlight-color: transparent; }

      /* Smooth momentum scrolling on iOS */
      * { -webkit-overflow-scrolling: touch; }

      /* Hide scrollbars but keep scroll functionality */
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; }

      /* Desktop: center app in phone-frame style */
      @media (min-width: 600px) {
        body {
          display: flex;
          justify-content: center;
          background: radial-gradient(ellipse at 50% 0%, #1a0f4f 0%, #0A0720 60%);
          overflow: hidden;
        }
        #root {
          max-width: 430px;
          width: 100%;
          box-shadow: 0 0 120px rgba(123, 110, 246, 0.2),
                      0 0 0 1px rgba(123, 110, 246, 0.1);
          border-radius: 0;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Boot watchdog. A JS parse/throw before React mounts leaves #root empty and the
      screen blank, which is unreportable from inside the Telegram WebView. This shows
      the failure on screen instead. Self-removes once React renders anything.
    -->
    <script>
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        errs.push((e.message || 'error') + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason; errs.push('promise: ' + ((r && (r.message || r.code)) || r));
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.children.length) return; // React mounted — nothing to do
        var tg = window.Telegram && window.Telegram.WebApp;
        var rows = [
          ['bundle', window.__SOMA_BUNDLE_OK__ ? 'executed' : 'DID NOT EXECUTE'],
          ['telegram sdk', tg ? 'loaded' : 'missing'],
          ['initData', tg && tg.initData ? 'present' : 'none'],
          ['platform', (tg && tg.platform) || 'n/a'],
          ['ua', navigator.userAgent]
        ];
        var html = '<div style="font:13px/1.5 -apple-system,system-ui,sans-serif;color:#EDEAFF;padding:22px;height:100%;overflow:auto;-webkit-overflow-scrolling:touch">'
          + '<div style="font-size:17px;font-weight:700;margin-bottom:4px">SOMA failed to start</div>'
          + '<div style="opacity:.65;margin-bottom:16px">Screenshot this and send it to support.</div>';
        if (errs.length) {
          html += '<div style="background:rgba(255,90,90,.13);border:1px solid rgba(255,90,90,.4);border-radius:10px;padding:12px;margin-bottom:14px">'
            + '<div style="font-weight:700;color:#FF9B9B;margin-bottom:6px">Error</div>'
            + errs.map(function (x) {
                return '<div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-word;margin-bottom:4px">' + String(x).replace(/</g, '&lt;') + '</div>';
              }).join('')
            + '</div>';
        }
        html += rows.map(function (r) {
          return '<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)">'
            + '<span style="opacity:.6;min-width:92px;flex-shrink:0">' + r[0] + '</span>'
            + '<span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all">' + String(r[1]).replace(/</g, '&lt;') + '</span></div>';
        }).join('');
        html += '<a href="https://mysoma.site" style="display:block;margin-top:20px;background:#7B6EF6;color:#fff;text-align:center;padding:13px;border-radius:11px;font-weight:700;text-decoration:none">Reload</a></div>';
        root.innerHTML = html;
      }, 8000);
    })();
    </script>
    <!-- Expo JS bundle is injected here by `expo export -p web` -->
  </body>
</html>
