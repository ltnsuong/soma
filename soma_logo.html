<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOMA Logo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      width: 400px;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 200px;
      height: 200px;
      margin-bottom: 40px;
    }

    .soma-text {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 3px;
      color: #5b21b6;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Define gradients -->
      <defs>
        <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
        </linearGradient>

        <radialGradient id="purpleRadial" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
        </radialGradient>
      </defs>

      <!-- Outer circle (technology ring) -->
      <circle cx="100" cy="100" r="95" fill="none" stroke="url(#purplePink)" stroke-width="2" opacity="0.4"/>

      <!-- Middle circle (connection ring) -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="url(#purplePink)" stroke-width="1.5" opacity="0.6"/>

      <!-- Core circle with gradient -->
      <circle cx="100" cy="100" r="60" fill="url(#purpleRadial)" opacity="0.9"/>

      <!-- Heart shape overlay (organic element) -->
      <g transform="translate(100, 95)">
        <!-- Heart path simplified for elegance -->
        <path d="M 0,-15 C -12,-28 -28,-28 -28,-10 C -28,8 -8,25 0,32 C 8,25 28,8 28,-10 C 28,-28 12,-28 0,-15 Z"
              fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.7"/>
      </g>

      <!-- Inner circuit-like elements (technology) -->
      <g opacity="0.5">
        <circle cx="100" cy="70" r="3" fill="#ec4899"/>
        <circle cx="70" cy="100" r="3" fill="#ec4899"/>
        <circle cx="130" cy="100" r="3" fill="#ec4899"/>
        <circle cx="100" cy="130" r="3" fill="#ec4899"/>

        <!-- Connecting lines (subtle) -->
        <line x1="100" y1="73" x2="100" y2="85" stroke="#ec4899" stroke-width="0.8" opacity="0.4"/>
        <line x1="97" y1="100" x2="85" y2="100" stroke="#ec4899" stroke-width="0.8" opacity="0.4"/>
        <line x1="103" y1="100" x2="115" y2="100" stroke="#ec4899" stroke-width="0.8" opacity="0.4"/>
        <line x1="100" y1="103" x2="100" y2="127" stroke="#ec4899" stroke-width="0.8" opacity="0.4"/>
      </g>

      <!-- Pulsing accent dots (connection suggestion) -->
      <g opacity="0.6">
        <circle cx="100" cy="100" r="20" fill="none" stroke="url(#purplePink)" stroke-width="0.8" stroke-dasharray="2,3"/>
      </g>
    </svg>

    <div class="soma-text">SOMA</div>
  </div>
</body>
</html>
